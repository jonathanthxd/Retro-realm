name: Build Retro Realm APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto Android
        run: |
          mkdir -p proj/app/src/main/java/com/pixelquest/game proj/app/src/main/assets
          f=$( [ -f Retro_Realm.html ] && echo Retro_Realm.html || ls *.html | head -1 )
          cp "$f" proj/app/src/main/assets/index.html
          for m in menu.mp3 bosque_oscuro.mp3 jefe.mp3; do
            if [ -f "$m" ]; then cp "$m" proj/app/src/main/assets/; else echo "::warning::No se encontro $m en el repositorio"; fi
          done
          ls -la proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/mipmap-xxxhdpi
          cp Retro.jpg proj/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'RetroRealm'
          include ':app'
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > proj/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.pixelquest.game'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.pixelquest.game'
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName '0.21-alpha'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Retro Realm" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/com/pixelquest/game/MainActivity.java <<'EOF'
          package com.pixelquest.game;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception e) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/index.html");
                  immersive();
              }
              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RetroRealm-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
