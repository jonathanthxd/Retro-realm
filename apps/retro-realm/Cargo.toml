[package]
name = "retro-realm"
version.workspace = true
edition.workspace = true
description = "Retro Realm nativo con Rust y Macroquad"
publish = false

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }
realm-core = { path = "../../crates/realm-core" }

[package.metadata.android]
android_version = 35
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
fullscreen = true
package_name = "com.pixelquest.game.preview"
label = "Retro Realm"
version_code = 4
min_sdk_version = 21
target_sdk_version = 34
assets = "assets/"

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "sensorLandscape"
